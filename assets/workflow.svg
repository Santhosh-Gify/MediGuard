<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="MediGuard workflow">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6EEF6"/><stop offset="1" stop-color="#E9D8EA"/></linearGradient></defs>
<style>
.t{font-family:'Poppins','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes ping{0%{opacity:.85;transform:scale(1)}16%{opacity:0;transform:scale(1.7)}100%{opacity:0;transform:scale(1.7)}}
@keyframes bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes tick{0%{stroke-dashoffset:60}40%,100%{stroke-dashoffset:0}}
.ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 6s ease-out infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 2.4s ease-in-out infinite}
.tick{animation:tick 2.4s ease-in-out infinite}
</style>
<rect width="1000" height="250" rx="24" fill="url(#bg)"/>
<line x1="140" y1="100" x2="860" y2="100" stroke="#C8577A" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round" style="animation:flow 1.2s linear infinite"/>
<g>
<circle class="ping" style="animation-delay:0.0s" cx="100" cy="100" r="40" fill="none" stroke="#C8577A" stroke-width="3"/>
<circle cx="100" cy="100" r="40" fill="#FBF5FB" stroke="#A63D62" stroke-width="3"/>
<circle cx="100" cy="92" r="8" fill="#7A1E48"/><path d="M85,118 a15,15 0 0 1 30,0 z" fill="#7A1E48"/>
<text x="100" y="176" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#6E1A42">Caretaker sets up</text>
<text x="100" y="199" text-anchor="middle" class="t" font-size="13" fill="#8A2A56">photo · dose · schedule</text></g><g>
<circle class="ping" style="animation-delay:1.2s" cx="300" cy="100" r="40" fill="none" stroke="#C8577A" stroke-width="3"/>
<circle cx="300" cy="100" r="40" fill="#FBF5FB" stroke="#A63D62" stroke-width="3"/>
<circle cx="300" cy="100" r="16" fill="none" stroke="#7A1E48" stroke-width="3"/><line x1="300" y1="100" x2="300" y2="89" stroke="#7A1E48" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="100" x2="308" y2="105" stroke="#C8577A" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 300 100" to="360 300 100" dur="6s" repeatCount="indefinite"/></line>
<text x="300" y="176" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#6E1A42">Alarm rings</text>
<text x="300" y="199" text-anchor="middle" class="t" font-size="13" fill="#8A2A56">photo + message + voice</text></g><g>
<circle class="ping" style="animation-delay:2.4s" cx="500" cy="100" r="40" fill="none" stroke="#C8577A" stroke-width="3"/>
<circle cx="500" cy="100" r="40" fill="#FBF5FB" stroke="#A63D62" stroke-width="3"/>
<path d="M484,101 l11,11 l21,-24" fill="none" stroke="#7A1E48" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" class="tick"/>
<text x="500" y="176" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#6E1A42">Patient taps</text>
<text x="500" y="199" text-anchor="middle" class="t" font-size="13" fill="#8A2A56">tick or voice reply</text></g><g>
<circle class="ping" style="animation-delay:3.5999999999999996s" cx="700" cy="100" r="40" fill="none" stroke="#C8577A" stroke-width="3"/>
<circle cx="700" cy="100" r="40" fill="#FBF5FB" stroke="#A63D62" stroke-width="3"/>
<g><path d="M715,100 a15,15 0 1 1 -6,-12" fill="none" stroke="#7A1E48" stroke-width="4" stroke-linecap="round"/><path d="M702,84 l10,2 l-4,9 z" fill="#7A1E48"/><animateTransform attributeName="transform" type="rotate" from="0 700 100" to="360 700 100" dur="5s" repeatCount="indefinite"/></g>
<text x="700" y="176" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#6E1A42">Everything syncs</text>
<text x="700" y="199" text-anchor="middle" class="t" font-size="13" fill="#8A2A56">offline-first, nothing lost</text></g><g>
<circle class="ping" style="animation-delay:4.8s" cx="900" cy="100" r="40" fill="none" stroke="#C8577A" stroke-width="3"/>
<circle cx="900" cy="100" r="40" fill="#FBF5FB" stroke="#A63D62" stroke-width="3"/>
<g fill="#7A1E48"><rect class="bar" style="animation-delay:0s" x="883" y="106" width="9" height="12" rx="2"/><rect class="bar" style="animation-delay:.4s" x="896" y="94" width="9" height="24" rx="2" fill="#C8577A"/><rect class="bar" style="animation-delay:.8s" x="909" y="82" width="9" height="36" rx="2"/></g>
<text x="900" y="176" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#6E1A42">Doctor sees it</text>
<text x="900" y="199" text-anchor="middle" class="t" font-size="13" fill="#8A2A56">calendar · charts · trends</text></g>
</svg>